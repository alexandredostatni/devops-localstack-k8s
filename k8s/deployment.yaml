apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  labels:
    app: myapp

spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp

  template:
    metadata:
      labels:
        app: myapp

    spec:
      containers:
        - name: myapp
          image: myapp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: AWS_ENDPOINT_URL
              value: "http://host.docker.internal:4566"
